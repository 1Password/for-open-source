name: Test processor

on:
  push:
    paths:
      - "script/**"

permissions:
  contents: read

jobs:
  test-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "script/go.mod"
          cache-dependency-path: "script/go.sum"

      - name: Install dependencies
        run: make install_deps

      - name: Test processor
        run: make test
