name: Aggregate applicant data

on:
  push:
    # skip Dependabot branches, which don't have access to Actions secrets
    branches-ignore:
      - "dependabot/**"
    paths:
      - "data/**"

  # allow for manual deploys
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: vars.PROCESSOR_ENABLED == 'true'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch processor
        uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # 1.1.2
        with:
          file: "processor"
          target: "./processor"

      - name: Aggregate applicant data
        run: |
          chmod +x ./processor
          ./processor aggregate
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OP_BOT_PAT: ${{ secrets.OP_BOT_PAT }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
