name: Aggregate applicant data

on:
  push:
    paths:
      - "data/**"

  # allow for manual deploys
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: vars.PROCESSOR_ENABLED == 'true'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch processor
        uses: dsaltares/fetch-gh-release-asset@a40c8b4a0471f9ab81bdf73a010f74cc51476ad4 # 1.1.1
        with:
          file: "processor"
          target: "./processor"

      - name: Aggregate applicant data
        run: |
          chmod +x ./processor
          ./processor aggregate
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          OP_BOT_PAT: ${{ secrets.OP_BOT_PAT }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
